# Sohibna web (PWA) — static nginx container in the same namespace as
# sohibna-api. Applied ONCE with `kubectl apply -f k8s/deployment.yaml`;
# after that the GitHub Actions workflow only does `kubectl set image`.
#
# BEFORE applying:
#   kubectl get ingress -n cendekita -o yaml   → copy the ingress class +
#   TLS annotations the existing sohibna-api ingress uses into the Ingress
#   below, and point DNS (sohibna.cendekita.id) at the ingress load balancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sohibna-web-deployment
  namespace: cendekita
  labels:
    app: sohibna-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sohibna-web
  template:
    metadata:
      labels:
        app: sohibna-web
    spec:
      containers:
        - name: sohibna-web
          image: dimasbagussusilo/sohibna-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sohibna-web-service
  namespace: cendekita
spec:
  selector:
    app: sohibna-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sohibna-web-ingress
  namespace: cendekita
  annotations:
    # TODO: copy the real class + cert annotations from the sohibna-api
    # ingress before applying (`kubectl get ingress -n cendekita -o yaml`).
    # Example (nginx + cert-manager):
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: sohibna.cendekita.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sohibna-web-service
                port:
                  number: 8080
