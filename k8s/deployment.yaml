# Sohibna web (PWA) — static nginx container in the same namespace as
# sohibna-api. Applied ONCE with `kubectl apply -f k8s/deployment.yaml`;
# after that the GitHub Actions workflow only does `kubectl set image`.
#
# BEFORE applying (one-time, manual):
#   1. DNS: A record for app.sohibna.com → 84.247.146.71 (the cluster's
#      traefik LoadBalancer IP).
#   2. Apply this file; TLS annotations below are the cluster's real setup
#      (Traefik + Let's Encrypt, copied from the live midwifery-web-ingress /
#      dbs-profile-ingress) — the cert is issued on first HTTPS hit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sohibna-web-deployment
  namespace: cendekita
  labels:
    app: sohibna-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sohibna-web
  template:
    metadata:
      labels:
        app: sohibna-web
    spec:
      containers:
        - name: sohibna-web
          image: dimasbagussusilo/sohibna-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sohibna-web-service
  namespace: cendekita
spec:
  selector:
    app: sohibna-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sohibna-web-ingress
  namespace: cendekita
  annotations:
    # Traefik + Let's Encrypt — the cluster's actual setup (verified against
    # the live ingresses; there is no cert-manager on this cluster).
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: app.sohibna.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sohibna-web-service
                port:
                  number: 8080
